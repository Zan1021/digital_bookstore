# Runs the PHP and Python test suites on every push and pull request (task 1.4, Req 26.5).
#
# The corpus books live outside the repo (copyright), so tests that need them report SKIP
# here; run the full suite locally with the books next to the repo. Only the open-licence
# fonts are in git (storage/app/fonts/OFL.txt). No AI keys are configured: tests never
# call OpenAI or ElevenLabs.
name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP (php artisan test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, gd, zip
          coverage: none

      # Some PHP tests shell out to scripts/*.py (e.g. the wiring audit gate).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: php artisan test

  python:
    name: Python (scripts/run_python_tests.py)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt

      - run: python scripts/run_python_tests.py --timeout 600
