# Runs the PHP and Python test suites on every push and pull request (task 1.4, Req 26.5).
#
# The corpus books live outside the repo (copyright), so tests that need them report SKIP
# here; run the full suite locally with the books next to the repo. Only the open-licence
# fonts are in git (storage/app/fonts/OFL.txt). No AI keys are configured: tests never
# call OpenAI or ElevenLabs.
name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    # SQLite for development, PostgreSQL for production (task 5.1): both must pass.
    name: PHP (php artisan test, ${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookstore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # phpunit.xml defaults to in-memory SQLite; these take over for the pgsql run.
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: ${{ matrix.database == 'pgsql' && '127.0.0.1' || '' }}
      DB_PORT: ${{ matrix.database == 'pgsql' && '5432' || '' }}
      DB_DATABASE: ${{ matrix.database == 'pgsql' && 'bookstore_test' || ':memory:' }}
      DB_USERNAME: ${{ matrix.database == 'pgsql' && 'postgres' || '' }}
      DB_PASSWORD: ${{ matrix.database == 'pgsql' && 'postgres' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql, pgsql, fileinfo, gd, zip
          coverage: none

      # Some PHP tests shell out to scripts/*.py (e.g. the wiring audit gate).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt

      - run: composer install --no-interaction --no-progress --prefer-dist

      # Auth pages (Breeze layouts) load the Vite build; tests render them.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Every migration must run up and back down on PostgreSQL, not only on SQLite.
      - name: Migrations up and down (PostgreSQL)
        if: matrix.database == 'pgsql'
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:reset --force
          php artisan migrate --force

      - run: php artisan test

  python:
    name: Python (scripts/run_python_tests.py)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt

      - run: python scripts/run_python_tests.py --timeout 600
